# Builds Lumio's image (the web app and its server in one) and publishes it to the GitHub Container Registry:
#   ghcr.io/<owner>/lumio:latest   from main
#   ghcr.io/<owner>/lumio:1.2.3    from a tag v1.2.3 (also 1.2)
# The image is built to sit in front of Jellyfin (VITE_JELLYFIN_URL=/: Jellyfin is found on the address Lumio is opened
# on), so it works under any domain. It holds no keys for outside services: whoever runs it sets their own on the
# container (LASTFM_API_KEY, TICKETMASTER_API_KEY, TMDB_API_KEY), and the app asks those services through its server.
name: Image

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/lumio
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short

      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VITE_JELLYFIN_URL=/
            VITE_SERVER_LOCKED=true
            LUMIO_BUILD=${{ github.ref_type == 'tag' && github.ref_name || github.sha }}
          # Layers are cached in the Actions cache, not the registry (keeps package storage small).
          cache-from: type=gha
          cache-to: type=gha,mode=max
