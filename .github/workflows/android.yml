# Builds Lumio's Android app and attaches it to the GitHub Release of the tag (v1.2.3 → lumio-1.2.3.apk). The APK goes
# straight onto the Release: no workflow artifacts (their storage is shared across all repositories and tight).
#
# Signing: the repository secrets ANDROID_KEYSTORE_BASE64 (the keystore, base64), ANDROID_KEYSTORE_PASSWORD,
# ANDROID_KEY_ALIAS and ANDROID_KEY_PASSWORD. Keep a copy of the keystore outside GitHub: an app signed with another key
# can't update an installed one (users would have to uninstall, losing their downloads). Without the secrets the run
# fails rather than publishing an APK nobody could update.
name: Android

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # The version comes from package.json (packageManager).
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: 21

      # Gradle's downloads and build cache live in the Actions cache (not artifact storage).
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4

      - run: pnpm install --frozen-lockfile

      # The pages for the app (.env.android: they carry themselves and ask for the server), copied into android/.
      - run: pnpm build:android

      - name: Version
        id: version
        run: |
          version="${GITHUB_REF_NAME#v}"
          [ "$GITHUB_REF_TYPE" = tag ] || version="0.0.0-${GITHUB_SHA::7}"
          echo "name=$version" >> "$GITHUB_OUTPUT"

      - name: Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then echo "::error::ANDROID_KEYSTORE_BASE64 is not set"; exit 1; fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/lumio.jks"

      - name: Build
        working-directory: android
        env:
          LUMIO_VERSION: ${{ steps.version.outputs.name }}
          LUMIO_VERSION_CODE: ${{ github.run_number }}
          LUMIO_KEYSTORE: ${{ runner.temp }}/lumio.jks
          LUMIO_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          LUMIO_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          LUMIO_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          ./gradlew assembleRelease --no-daemon
          cp app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/lumio-${LUMIO_VERSION}.apk"

      - name: Release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
          APK: ${{ runner.temp }}/lumio-${{ steps.version.outputs.name }}.apk
        run: |
          # The Android and desktop jobs share the Release; whichever comes first creates it.
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --generate-notes --verify-tag || true
          gh release upload "$GITHUB_REF_NAME" "$APK" --clobber
