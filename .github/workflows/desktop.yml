# Builds Lumio's desktop app (Electron) for Windows (NSIS installer) and Linux (AppImage, deb) and attaches the files to
# the GitHub Release of the tag, next to the Android APK. No workflow artifacts (their storage is tight); unsigned on
# Windows for now (SmartScreen warns on first start).
name: Desktop

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: desktop-${{ github.ref }}-${{ github.workflow }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: --win
          # The oldest supported Ubuntu: the AppImage then runs on older systems too (glibc).
          - os: ubuntu-22.04
            target: --linux
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # The version comes from package.json (packageManager).
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Version
        id: version
        run: |
          version="${GITHUB_REF_NAME#v}"
          [ "$GITHUB_REF_TYPE" = tag ] || version="0.0.0-${GITHUB_SHA::7}"
          echo "name=$version" >> "$GITHUB_OUTPUT"

      # The pages for the app (.env.desktop: they carry themselves and ask for the server), into electron/dist.
      - run: pnpm build:desktop

      # The version comes from the tag name: passed as a variable, never written into the script itself.
      - run: pnpm exec electron-builder ${{ matrix.target }} --publish never "-c.extraMetadata.version=$VERSION"
        env:
          VERSION: ${{ steps.version.outputs.name }}

      - name: Release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The Android and desktop jobs share the Release; whichever comes first creates it.
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --generate-notes --verify-tag || true
          shopt -s nullglob
          files=(release/lumio-*.exe release/lumio-*.AppImage release/lumio-*.deb)
          gh release upload "$GITHUB_REF_NAME" "${files[@]}" --clobber
